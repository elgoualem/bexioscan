    // Convertit un PDF (base64) en images JPEG (base64) pour les LLM qui ne lisent pas les PDF
    async function pdfVersImages(base64Pdf, maxPages = 8) {
      if (!window.pdfjsLib) throw new Error("pdf.js indisponible : ce modèle ne lit que des images");
      const bin = atob(base64Pdf);
      const buf = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
      const pdf = await window.pdfjsLib.getDocument({ data: buf }).promise;
      const imgs = [];
      for (let p = 1; p <= Math.min(pdf.numPages, maxPages); p++) {
        const page = await pdf.getPage(p);
        const vp = page.getViewport({ scale: 1.6 });
        const canvas = document.createElement("canvas");
        canvas.width = vp.width; canvas.height = vp.height;
        await page.render({ canvasContext: canvas.getContext("2d"), viewport: vp }).promise;
        imgs.push(canvas.toDataURL("image/jpeg", 0.85).split(",")[1]);
      }
      return imgs;
    }


    // Extrait des pages (1-based) d'un PDF base64 et reconstruit un PDF contenant uniquement ces pages
    async function pdfPagesVersFichier(base64Pdf, pagesNums, nom) {
      if (!window.pdfjsLib) throw new Error("pdf.js indisponible");
      const { jsPDF } = window.jspdf;
      const bin = atob(base64Pdf);
      const buf = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
      const pdf = await window.pdfjsLib.getDocument({ data: buf }).promise;
      const valides = [...new Set(pagesNums.map(n => parseInt(n, 10)))].filter(n => n >= 1 && n <= pdf.numPages).sort((x, y) => x - y);
      if (valides.length === 0) return null;
      const A4_W = 210, A4_H = 297, MARGE = 8;
      let doc = null;
      for (let i = 0; i < valides.length; i++) {
        const page = await pdf.getPage(valides[i]);
        const vp = page.getViewport({ scale: 1.6 });
        const canvas = document.createElement("canvas");
        canvas.width = vp.width; canvas.height = vp.height;
        await page.render({ canvasContext: canvas.getContext("2d"), viewport: vp }).promise;
        const dataUrl = canvas.toDataURL("image/jpeg", 0.85);
        const orientation = canvas.width > canvas.height ? "l" : "p";
        const pageW = orientation === "l" ? A4_H : A4_W;
        const pageH = orientation === "l" ? A4_W : A4_H;
        const echelle = Math.min((pageW - MARGE * 2) / canvas.width, (pageH - MARGE * 2) / canvas.height);
        const fw = canvas.width * echelle, fh = canvas.height * echelle;
        if (i === 0) doc = new jsPDF({ orientation, unit: "mm", format: [pageW, pageH] });
        else doc.addPage([pageW, pageH], orientation);
        doc.addImage(dataUrl, "JPEG", (pageW - fw) / 2, (pageH - fh) / 2, fw, fh);
      }
      const b64 = doc.output("datauristring").split(",")[1];
      const out = atob(b64);
      const bytes = new Uint8Array(out.length);
      for (let i = 0; i < out.length; i++) bytes[i] = out.charCodeAt(i);
      return new File([bytes], nom, { type: "application/pdf" });
    }

    // Appelle le LLM choisi et renvoie le texte brut de la réponse
    async function appelerLLM({ providerId, model, key, prompt, base64, mime }) {
      const P = LLM_PROVIDERS[providerId];
      const isPdf = mime === "application/pdf";
      let res, json;

      if (P.type === "anthropic") {
        res = await fetch("https://api.anthropic.com/v1/messages", {
          method: "POST",
          headers: { "Content-Type": "application/json", "x-api-key": key, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
          body: JSON.stringify({ model, max_tokens: P.maxOut, messages: [{ role: "user", content: [
            { type: isPdf ? "document" : "image", source: { type: "base64", media_type: mime, data: base64 } },
            { type: "text", text: prompt },
          ] }] }),
        });
        json = await res.json();
        if (!res.ok || json.type === "error") throw new Error(json.error?.message || `Erreur API (${res.status})`);
        return json.content?.map(b => b.text || "").join("") || "";
      }

      if (P.type === "gemini") {
        res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, {
          method: "POST",
          headers: { "Content-Type": "application/json", "x-goog-api-key": key },
          body: JSON.stringify({
            contents: [{ role: "user", parts: [{ inline_data: { mime_type: mime, data: base64 } }, { text: prompt }] }],
            generationConfig: { maxOutputTokens: P.maxOut },
          }),
        });
        json = await res.json();
        if (!res.ok) throw new Error(json.error?.message || `Erreur API (${res.status})`);
        return json.candidates?.[0]?.content?.parts?.map(p => p.text || "").join("") || "";
      }

      // API compatible OpenAI (OpenAI, Qwen, Kimi, GLM…)
      let parts;
      if (isPdf && P.pdf) {
        parts = [{ type: "file", file: { filename: "document.pdf", file_data: `data:application/pdf;base64,${base64}` } }];
      } else if (isPdf) {
        parts = (await pdfVersImages(base64)).map(b => ({ type: "image_url", image_url: { url: `data:image/jpeg;base64,${b}` } }));
      } else {
        parts = [{ type: "image_url", image_url: { url: `data:${mime};base64,${base64}` } }];
      }
      parts.push({ type: "text", text: prompt });
      const cible = `${P.base}/chat/completions`;
      const url = P.proxy ? `/llm-proxy?url=${encodeURIComponent(cible)}` : cible;
      const body = { model, messages: [{ role: "user", content: parts }] };
      body[providerId === "openai" ? "max_completion_tokens" : "max_tokens"] = P.maxOut;
      res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${key}` },
        body: JSON.stringify(body),
      });
      json = await res.json();
      if (!res.ok) throw new Error(json.error?.message || json.message || `Erreur API (${res.status})`);
      return json.choices?.[0]?.message?.content || "";
    }

      { id: null, code: "8901", label: "Impôts hors exercice" },
    ];

    const TVA_CH = [
      { taux: 8.1,  label: "8.1% — Taux normal" },
      { taux: 2.6,  label: "2.6% — Taux réduit (alim./méd./livres)" },
      { taux: 3.8,  label: "3.8% — Hôtellerie" },
      { taux: 0,    label: "0% — Exonéré / hors TVA" },
    ];

    const MOIS_FR = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];

    // Mois/année utilisés pour la numérotation (g{mois}{aa}/{seq}) — figé manuellement via les réglages,
    // indépendant de la date système et de la date de la facture. Par défaut : mois civil en cours.
    const CLE_MOIS_ACTIF = "bx_mois_actif";
    function getMoisActif() {
      try {
        const stocke = JSON.parse(localStorage.getItem(CLE_MOIS_ACTIF) || "null");
        if (stocke && Number.isInteger(stocke.moisIdx) && Number.isInteger(stocke.annee)) return stocke;
      } catch (_) {}
      const now = new Date();
      return { moisIdx: now.getMonth(), annee: now.getFullYear() };
    }
    function setMoisActif(moisIdx, annee) {
      localStorage.setItem(CLE_MOIS_ACTIF, JSON.stringify({ moisIdx, annee }));
    }

    // Stockage des fichiers (base64) des tickets en attente dans IndexedDB — localStorage a un quota trop
    // faible (~5-10 Mo) pour tenir plusieurs PDF/photos, d'où le "QuotaExceededError" sur bx_tickets_*.
    function idbOpen() {
      return new Promise((res, rej) => {
        const req = indexedDB.open("bexioscan", 1);
        req.onupgradeneeded = () => req.result.createObjectStore("fichiers");
        req.onsuccess = () => res(req.result);
        req.onerror = () => rej(req.error);
      });
    }
    async function idbSetFichier(cle, valeur) {
      const db = await idbOpen();
      return new Promise((res, rej) => {
        const tx = db.transaction("fichiers", "readwrite");
        tx.objectStore("fichiers").put(valeur, cle);
        tx.oncomplete = () => res();
        tx.onerror = () => rej(tx.error);
      });
    }
    async function idbGetFichier(cle) {
      const db = await idbOpen();
      return new Promise((res, rej) => {
        const tx = db.transaction("fichiers", "readonly");
        const req = tx.objectStore("fichiers").get(cle);
        req.onsuccess = () => res(req.result || null);
        req.onerror = () => rej(req.error);
      });
    }
    async function idbDeleteFichier(cle) {
      const db = await idbOpen();
      return new Promise((res, rej) => {
        const tx = db.transaction("fichiers", "readwrite");
        tx.objectStore("fichiers").delete(cle);
        tx.oncomplete = () => res();
        tx.onerror = () => rej(tx.error);
      });
    }

    /* Génère le numéro interne au format g{mois}{AA}/{seq} — compteur mensuel persisté en localStorage.
       Le mois/année utilisés viennent du mois actif figé dans les réglages, pas de la date système. */
    function genererNumeroFacture() {
      const { moisIdx, annee } = getMoisActif();
      const mois = MOIS_FR[moisIdx];
      const cle = `bx_compteur_${annee}-${String(moisIdx + 1).padStart(2, "0")}`;
      const compteur = parseInt(localStorage.getItem(cle) || "0", 10) + 1;
      localStorage.setItem(cle, String(compteur));
      return `g${mois}${String(annee).slice(-2)}/${String(compteur).padStart(3, "0")}`;
    }

    function peekNumeroFacture() {
      const { moisIdx, annee } = getMoisActif();
      const mois = MOIS_FR[moisIdx];
      const cle = `bx_compteur_${annee}-${String(moisIdx + 1).padStart(2, "0")}`;
      const compteur = parseInt(localStorage.getItem(cle) || "0", 10) + 1;
      return `g${mois}${String(annee).slice(-2)}/${String(compteur).padStart(3, "0")}`;
    }

    // File d'attente unique des tickets, indépendante du mois — tu consolides quand tu veux, pas seulement en fin de mois.
    const CLE_TICKETS_ATTENTE = "bx_tickets_attente";

    // Migration : fusionne les anciennes clés mensuelles (bx_tickets_2026-07 etc.) dans la file unique,
    // pour ne pas perdre les tickets déjà en attente sous l'ancien système.
    function migrerAnciennesClesTickets() {
      try {
        const fusion = JSON.parse(localStorage.getItem(CLE_TICKETS_ATTENTE) || "[]");
        let modifie = false;
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && /^bx_tickets_\d{4}-\d{2}$/.test(k)) {
            const anciens = JSON.parse(localStorage.getItem(k) || "[]");
            if (anciens.length > 0) { fusion.push(...anciens); modifie = true; }
            localStorage.removeItem(k);
          }
        }
        if (modifie) localStorage.setItem(CLE_TICKETS_ATTENTE, JSON.stringify(fusion));
      } catch (_) {}
    }
    migrerAnciennesClesTickets();

    // Verrou en mémoire : évite qu'un scan concurrent écrase les tickets ajoutés par un autre scan en cours
    let ticketWriteLock = Promise.resolve();
    function ajouterTicketsEnAttente(cleTickets, nouveauxTickets) {
      const p = ticketWriteLock.then(async () => {
        // chaque fichier lourd part en IndexedDB, seule une clé de référence reste dans le ticket
        const tickets = await Promise.all(nouveauxTickets.map(async t => {
          const { fichier, ...meta } = t;
          const ficId = `${cleTickets}_${meta.ts}_${Math.random().toString(36).slice(2)}`;
          if (fichier) await idbSetFichier(ficId, fichier);
          return { ...meta, ficId };
        }));
        const existing = JSON.parse(localStorage.getItem(cleTickets) || "[]");
        existing.push(...tickets);
        localStorage.setItem(cleTickets, JSON.stringify(existing));
      });
      ticketWriteLock = p.catch(() => {});
      return p;
    }

    // Si l'utilisateur a modifié/saisi le numéro interne à la main, le compteur du mois doit repartir de là
    // (format g{mois}{aa}/{seq}) pour que la prochaine proposition soit seq+1.
    function syncCompteurDepuisNumero(numeroInterne) {
      const m = /^g([a-zéû]+)(\d{2})\/(\d+)$/i.exec((numeroInterne || "").trim());
      if (!m) return;
      const moisIdx = MOIS_FR.findIndex(mo => mo.toLowerCase() === m[1].toLowerCase());
      if (moisIdx === -1) return;
      const annee = 2000 + parseInt(m[2], 10);
      const seq = parseInt(m[3], 10);
      const cle = `bx_compteur_${annee}-${String(moisIdx + 1).padStart(2, "0")}`;
      localStorage.setItem(cle, String(seq));
    }

    // Normalisation du nom d'enseigne pour regrouper les variantes OCR (ex: "Coop Genève Charmilles" → "Coop")
    const CHAINES_CONNUES = ["coop", "denner", "lidl", "aldi"];
    function normaliserEnseigne(nom) {
      const n = (nom || "").toLowerCase();
      if (["genossenschaft", "coop genossenschaft"].some(e => n.includes(e))) return (nom || "").trim();
      const chaine = CHAINES_CONNUES.find(c => n.includes(c));
      return chaine ? chaine.charAt(0).toUpperCase() + chaine.slice(1) : (nom || "").trim();
    }

    // Anti-doublon : signature fournisseur+date+montant, persistée indéfiniment
    function signatureFacture(fournisseur, date, montant) {
      return `${(fournisseur || "").trim().toLowerCase()}|${(date || "").trim()}|${(parseFloat(montant) || 0).toFixed(2)}`;
    }
    function chargerSignatures() {
      return new Set(JSON.parse(localStorage.getItem("bx_signatures") || "[]"));
    }
    function sauverSignatures(set) {
      localStorage.setItem("bx_signatures", JSON.stringify([...set]));
    }

    // Répare un JSON tronqué (max_tokens atteint) en suivant la pile d'ouverture/fermeture des { } et [ ] :
    // on coupe à la dernière position où un élément du tableau "tickets" est complètement refermé,
    // puis on referme proprement toutes les structures encore ouvertes (gère les tableaux imbriqués lignes_tva).
    function reparerJsonTronque(brut) {
      const stack = [];
      let inString = false, escape = false;
      let lastSafeCut = -1;
      for (let i = 0; i < brut.length; i++) {
        const c = brut[i];
        if (escape) { escape = false; continue; }
        if (c === "\\") { escape = true; continue; }
        if (c === '"') { inString = !inString; continue; }
        if (inString) continue;
        if (c === "{" || c === "[") stack.push(c);
        else if (c === "}" || c === "]") {
          stack.pop();
          // position sûre = juste après avoir refermé un ticket qui est un élément direct du tableau racine "tickets"
          // (profondeur exacte 2 : "{" racine + "[" tickets — distingue d'une clôture de ligne dans lignes_tva, plus profonde)
          if (c === "}" && stack.length === 2 && stack[1] === "[") {
            lastSafeCut = i;
          }
        }
      }
      if (lastSafeCut === -1) return null;
      const coupe = brut.slice(0, lastSafeCut + 1);
      // reconstitue la pile encore ouverte au point de coupe pour refermer dans le bon ordre
      const stackAuCut = [];
      let inStr2 = false, esc2 = false;
      for (let i = 0; i <= lastSafeCut; i++) {
        const c = coupe[i];
        if (esc2) { esc2 = false; continue; }
        if (c === "\\") { esc2 = true; continue; }
        if (c === '"') { inStr2 = !inStr2; continue; }
        if (inStr2) continue;
        if (c === "{" || c === "[") stackAuCut.push(c);
        else if (c === "}" || c === "]") stackAuCut.pop();
      }
      const fermeture = stackAuCut.reverse().map(o => (o === "{" ? "}" : "]")).join("");
      try {
        return JSON.parse(coupe + fermeture);
      } catch (_) {
        return null;
      }
    }

    // Mémoire d'apprentissage : quand l'utilisateur corrige le compte d'une ligne, on retient
    // la correspondance (fournisseur + nature de l'achat) → compte pour l'appliquer aux prochains scans.
    function chargerReglesApprises() {
      try { return JSON.parse(localStorage.getItem("bx_regles_comptes") || "[]"); } catch (_) { return []; }
    }
    function sauverReglesApprises(regles) {
      localStorage.setItem("bx_regles_comptes", JSON.stringify(regles.slice(-200)));
    }
    function apprendreCorrection(fournisseur, description, ancienCompte, nouveauCompte, nouveauLibelle) {
      if (!nouveauCompte || nouveauCompte === ancienCompte) return;
      const regles = chargerReglesApprises();
      regles.push({
        fournisseur: (fournisseur || "").trim().toLowerCase(),
        description: (description || "").trim().toLowerCase(),
        compte_code: nouveauCompte,
        compte_libelle: nouveauLibelle || "",
        ts: Date.now(),
      });
      sauverReglesApprises(regles);
    }
    // Construit le bloc de règles apprises à injecter dans le prompt (la plus récente règle gagne par couple fournisseur+description)
    function reglesApprisesPourPrompt() {
      const regles = chargerReglesApprises();
      if (regles.length === 0) return "";
      const parClef = new Map();
      regles.forEach(r => parClef.set(`${r.fournisseur}|${r.description}`, r));
      const dernieres = [...parClef.values()].slice(-25);
      const lignes = dernieres.map(r =>
        `- Chez "${r.fournisseur}", pour un achat de type "${r.description}" → compte ${r.compte_code}${r.compte_libelle ? ` (${r.compte_libelle})` : ""} (correction déjà validée par l'utilisateur, à réappliquer).`
      );
      return `\n\nRègles apprises de tes corrections précédentes (l'utilisateur a déjà rectifié ces cas — applique-les en priorité si le fournisseur et la nature de l'achat correspondent) :\n${lignes.join("\n")}`;
    }

    function fileToDataURL(file) {
      return new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = () => res(r.result);
        r.onerror = rej;
        r.readAsDataURL(file);
      });
    }

    /* Convertit une image (photo de facture) en PDF, retourne le base64 du PDF */
    if (window.pdfjsLib) {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
    }

    // Réessaie une requête réseau en cas de coupure transitoire (ex: ERR_INTERNET_DISCONNECTED en plein envoi
    // d'un gros lot de tickets) — 2 tentatives supplémentaires avec un court délai, avant d'abandonner.
    async function fetchAvecRetry(url, options, tentatives = 3) {
      let derniereErreur;
      for (let i = 0; i < tentatives; i++) {
        try {
          return await fetch(url, options);
        } catch (e) {
          derniereErreur = e;
          if (i < tentatives - 1) await new Promise(r => setTimeout(r, 1500 * (i + 1)));
        }
      }
      throw derniereErreur;
    }

    const LIMITE_BEXIO_OCTETS = 9 * 1024 * 1024; // ~9 Mo, marge sous le quota réel de bexio

    async function convertImageToPdf(file) {
      const dataUrl = await fileToDataURL(file);
      const img = await new Promise((res, rej) => {
        const im = new Image();
        im.onload = () => res(im);
        im.onerror = rej;
        im.src = dataUrl;
      });
      const format = file.type.includes("png") ? "PNG" : "JPEG";
      const { jsPDF } = window.jspdf;
      // Page A4 fixe avec l'image centrée dedans (marge 8mm) — évite les pages à la taille brute en pixels
      // de la photo (des dizaines de cm/mètres), qui obligeaient à zoomer/scroller énormément pour tout voir.
      const A4_W = 210, A4_H = 297, MARGE = 8;
      const construire = (w, h, qualite) => {
        const orientation = w > h ? "l" : "p";
        const pageW = orientation === "l" ? A4_H : A4_W;
        const pageH = orientation === "l" ? A4_W : A4_H;
        const zoneW = pageW - MARGE * 2, zoneH = pageH - MARGE * 2;
        const echelle = Math.min(zoneW / w, zoneH / h);
        const finalW = w * echelle, finalH = h * echelle;
        const offsetX = (pageW - finalW) / 2, offsetY = (pageH - finalH) / 2;
        const doc = new jsPDF({ orientation, unit: "mm", format: [pageW, pageH] });
        const source = qualite === null ? dataUrl : (() => {
          const canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          canvas.getContext("2d").drawImage(img, 0, 0, w, h);
          return canvas.toDataURL("image/jpeg", qualite);
        })();
        doc.addImage(source, qualite === null ? format : "JPEG", offsetX, offsetY, finalW, finalH);
        return doc.output("datauristring").split(",")[1];
      };
      let b64 = construire(img.width, img.height, null);
      let taille = Math.round((b64.length * 3) / 4);
      // Réduction progressive UNIQUEMENT si ça dépasse la limite bexio — automatique, sans intervention manuelle.
      const paliers = [[2000, 0.85], [1600, 0.75], [1200, 0.65], [1000, 0.55]];
      for (const [cote, qualite] of paliers) {
        if (taille <= LIMITE_BEXIO_OCTETS) break;
        const ratio = Math.min(1, cote / Math.max(img.width, img.height));
        const w = Math.round(img.width * ratio), h = Math.round(img.height * ratio);
        b64 = construire(w, h, qualite);
        taille = Math.round((b64.length * 3) / 4);
      }
      return b64;
    }

    // Recompresse automatiquement un PDF déjà existant (scan externe, QR-facture...) uniquement s'il dépasse
    // la limite d'upload bexio — relit chaque page via pdf.js et la réintègre en JPEG, palier par palier.
    async function compresserPdfSiNecessaire(blob) {
      if (blob.size <= LIMITE_BEXIO_OCTETS || !window.pdfjsLib) return blob;
      const buf = await blob.arrayBuffer();
      const { jsPDF } = window.jspdf;
      const paliers = [1.5, 1.1, 0.85, 0.65];
      for (const scale of paliers) {
        try {
          const pdfDoc = await window.pdfjsLib.getDocument({ data: buf.slice(0) }).promise;
          let out = null;
          for (let n = 1; n <= pdfDoc.numPages; n++) {
            const page = await pdfDoc.getPage(n);
            const viewport = page.getViewport({ scale });
            const canvas = document.createElement("canvas");
            canvas.width = viewport.width; canvas.height = viewport.height;
            await page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;
            const jpeg = canvas.toDataURL("image/jpeg", 0.75);
            // viewport.width/height sont en pixels pour l'échelle "scale" — on revient aux points (taille physique
            // réelle de la page d'origine) pour ne pas produire une page géante à l'échelle brute des pixels.
            const pageWpt = viewport.width / scale;
            const pageHpt = viewport.height / scale;
            const orientation = pageWpt > pageHpt ? "l" : "p";
            if (!out) out = new jsPDF({ orientation, unit: "pt", format: [pageWpt, pageHpt] });
            else out.addPage([pageWpt, pageHpt], orientation);
            out.addImage(jpeg, "JPEG", 0, 0, pageWpt, pageHpt);
          }
          const nouveauBlob = out.output("blob");
          if (nouveauBlob.size <= LIMITE_BEXIO_OCTETS) return nouveauBlob;
          if (scale === paliers[paliers.length - 1]) return nouveauBlob; // dernier palier : on renvoie le mieux obtenu
        } catch (e) {
          console.error("Recompression PDF échouée:", e);
          return blob;
        }
      }
      return blob;
    }

    /* Attend que OpenCV.js soit pleinement initialisé (gère les différents modes d'export du module) */
    function getCv() {
      if (window.__cvReady) return window.__cvReady;
      window.__cvReady = (async () => {
        for (let i = 0; i < 150 && !window.cv; i++) await new Promise(r => setTimeout(r, 100));
        if (!window.cv) throw new Error("OpenCV indisponible");
        let cvObj = window.cv;
        if (cvObj instanceof Promise) cvObj = await cvObj;
        if (!cvObj.Mat) {
          await new Promise((resolve) => { cvObj.onRuntimeInitialized = resolve; });
        }
        window.cv = cvObj;
        return cvObj;
      })();
      return window.__cvReady;
    }

    function loadImageElement(url) {
      return new Promise((res, rej) => {
        const img = new Image();
        img.onload = () => res(img);
        img.onerror = rej;
        img.src = url;
      });
    }

    function distPts(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

    function orderQuadPoints(pts) {
      const sums = pts.map(p => p.x + p.y);
      const diffs = pts.map(p => p.x - p.y);
      const tl = pts[sums.indexOf(Math.min(...sums))];
      const br = pts[sums.indexOf(Math.max(...sums))];
      const tr = pts[diffs.indexOf(Math.max(...diffs))];
      const bl = pts[diffs.indexOf(Math.min(...diffs))];
      return [tl, tr, br, bl];
    }

    function warpToCanvas(cv, srcCanvas, [tl, tr, br, bl]) {
      const maxWidth = Math.round(Math.max(distPts(br, bl), distPts(tr, tl)));
      const maxHeight = Math.round(Math.max(distPts(tr, br), distPts(tl, bl)));
      const src = cv.imread(srcCanvas);
      const srcTri = cv.matFromArray(4, 1, cv.CV_32FC2, [tl.x, tl.y, tr.x, tr.y, br.x, br.y, bl.x, bl.y]);
      const dstTri = cv.matFromArray(4, 1, cv.CV_32FC2, [0, 0, maxWidth, 0, maxWidth, maxHeight, 0, maxHeight]);
      const M = cv.getPerspectiveTransform(srcTri, dstTri);
      const dst = new cv.Mat();
      cv.warpPerspective(src, dst, M, new cv.Size(maxWidth, maxHeight));
      const outCanvas = document.createElement("canvas");
      outCanvas.width = maxWidth;
      outCanvas.height = maxHeight;
      cv.imshow(outCanvas, dst);
      [src, srcTri, dstTri, M, dst].forEach(m => m.delete());
      return outCanvas;
    }

    function enhanceCanvas(cv, canvas) {
      const src = cv.imread(canvas);

      // Conversion en niveaux de gris
      const gray = new cv.Mat();
      cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);

      // Binarisation adaptative — élimine les ombres et variations d'éclairage
      const binary = new cv.Mat();
      cv.adaptiveThreshold(gray, binary, 255, cv.ADAPTIVE_THRESH_GAUSSIAN_C, cv.THRESH_BINARY, 21, 10);

      // Légère réduction du bruit
      const denoised = new cv.Mat();
      cv.medianBlur(binary, denoised, 3);

      // Reconversion en RGBA pour l'affichage canvas
      const out_gray = new cv.Mat();
      cv.cvtColor(denoised, out_gray, cv.COLOR_GRAY2RGBA);

      const out = document.createElement("canvas");
      out.width = canvas.width;
      out.height = canvas.height;
      cv.imshow(out, out_gray);

      [src, gray, binary, denoised, out_gray].forEach(m => m.delete());
      return out;
    }

    /* Détecte les bords du document, corrige la perspective puis améliore le contraste — façon scanner */
    async function scanAndEnhance(file) {
      const cv = await getCv();
      const dataUrl = await fileToDataURL(file);
      const imgEl = await loadImageElement(dataUrl);

      const srcCanvas = document.createElement("canvas");
      srcCanvas.width = imgEl.width;
      srcCanvas.height = imgEl.height;
      srcCanvas.getContext("2d").drawImage(imgEl, 0, 0);

      const MAX_DET = 1000;
      const scale = Math.min(1, MAX_DET / Math.max(imgEl.width, imgEl.height));
      const detCanvas = document.createElement("canvas");
      detCanvas.width = Math.round(imgEl.width * scale);
      detCanvas.height = Math.round(imgEl.height * scale);
      detCanvas.getContext("2d").drawImage(imgEl, 0, 0, detCanvas.width, detCanvas.height);

      let src, gray, blurred, edged, kernel, contours, hierarchy;
      let quad = null;
      try {
        src = cv.imread(detCanvas);
        gray = new cv.Mat();
        cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);

        // Flou plus fort pour ignorer les ombres et textures
        blurred = new cv.Mat();
        cv.GaussianBlur(gray, blurred, new cv.Size(9, 9), 0);

        // Détection de bords avec seuils plus larges
        edged = new cv.Mat();
        cv.Canny(blurred, edged, 30, 100);

        // Dilatation plus large pour relier les contours fragmentés
        kernel = cv.getStructuringElement(cv.MORPH_RECT, new cv.Size(5, 5));
        cv.dilate(edged, edged, kernel);
        cv.dilate(edged, edged, kernel);
        contours = new cv.MatVector();
        hierarchy = new cv.Mat();
        cv.findContours(edged, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

        let maxArea = 0;
        const imgArea = detCanvas.width * detCanvas.height;
        for (let i = 0; i < contours.size(); i++) {
          const cnt = contours.get(i);
          const area = cv.contourArea(cnt);
          if (area > imgArea * 0.1 && area > maxArea) {
            const peri = cv.arcLength(cnt, true);
            const approx = new cv.Mat();
            cv.approxPolyDP(cnt, approx, 0.03 * peri, true);
            if (approx.rows === 4) {
              maxArea = area;
              if (quad) quad.delete();
              quad = approx;
            } else {
              approx.delete();
            }
          }
          cnt.delete();
        }
      } finally {
        [src, gray, blurred, edged, kernel, hierarchy].forEach(m => m && m.delete());
        if (contours) contours.delete();
      }

      let outCanvas;
      let cropped = false;
      if (quad) {
        const pts = [];

      async function buildPdfFromPages(pagesList) {
        const { jsPDF } = window.jspdf;
        const A4_W = 210, A4_H = 297, MARGE = 8;
        let doc = null;
        for (let i = 0; i < pagesList.length; i++) {
          const dataUrl = await fileToDataURL(pagesList[i].blob);
          const img = await loadImageElement(dataUrl);
          const orientation = img.width > img.height ? "l" : "p";
          const pageW = orientation === "l" ? A4_H : A4_W;
          const pageH = orientation === "l" ? A4_W : A4_H;
          const zoneW = pageW - MARGE * 2, zoneH = pageH - MARGE * 2;
          const echelle = Math.min(zoneW / img.width, zoneH / img.height);
          const finalW = img.width * echelle, finalH = img.height * echelle;
          const offsetX = (pageW - finalW) / 2, offsetY = (pageH - finalH) / 2;
          if (i === 0) {
            doc = new jsPDF({ orientation, unit: "mm", format: [pageW, pageH] });
          } else {
            doc.addPage([pageW, pageH], orientation);
          }
          doc.addImage(dataUrl, "JPEG", offsetX, offsetY, finalW, finalH);
        }
        const base64 = doc.output("datauristring").split(",")[1];
        const bin = atob(base64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return new File([bytes], "facture.pdf", { type: "application/pdf" });

              const estPossibleDoublon = sigSet.has(sig);
              if (estPossibleDoublon) possiblesDoublons++;
              sigSet.add(sig);
              return {
                fournisseur: fournisseurNorm,
                date: t.date_facture,
                montant_ttc: t.montant_ttc,
                lignes_tva: t.lignes_tva,
                compte_suggere_code: t.compte_suggere_code || "4200",
                numero_interne: genererNumeroFacture(),
                ts: Date.now(),
                fichier: { base64, type: f.type, name: f.name },
                possibleDoublon: estPossibleDoublon,
              };
            });
            await ajouterTicketsEnAttente(cleTickets, nouveaux);
            sauverSignatures(sigSet);
            const messages = [];
            if (tronque) messages.push(`⚠ La réponse de Claude a été coupée (trop de tickets pour un seul scan) — seuls ${nouveaux.length} ticket(s) ont pu être récupérés. Il en manque probablement. Rescanne le reste en 2-3 photos séparées.`);
            if (possiblesDoublons > 0) messages.push(`${possiblesDoublons} ticket(s) ressemblent à un scan déjà fait (marqués "possible doublon" dans la liste) — vérifie avant de consolider, mais ils sont bien ajoutés.`);
            setError(messages.join(" "));
            if (!(Array.isArray(parsed.factures) && parsed.factures.length > 0)) {
              setStep(5);
              setLoading(false);
              setLoadingMsg("");
              return;
            }
          }

          // Lot de factures distinctes dans un même PDF : une entrée par facture, traitées l'une après l'autre
          if (Array.isArray(parsed.factures) && parsed.factures.length > 0) {
            const sigSetLot = chargerSignatures();
            const elements = [];
            for (let i = 0; i < parsed.factures.length; i++) {
              const fa = parsed.factures[i];
              if (!Array.isArray(fa.lignes_tva) || fa.lignes_tva.length === 0) {
                const ttc = parseFloat(fa.montant_ttc) || 0;
                fa.lignes_tva = [{ montant_ht: ttc / 1.081, taux_tva: 8.1, montant_tva: ttc - ttc / 1.081 }];
              }
              let fichierFa = f;
              if (isPdf && Array.isArray(fa.pages) && fa.pages.length > 0) {
                try {
                  const nomFa = `facture-${String(i + 1).padStart(2, "0")}-${(fa.fournisseur || "fournisseur").replace(/[^a-z0-9]+/gi, "_")}.pdf`;
                  fichierFa = (await pdfPagesVersFichier(base64, fa.pages, nomFa)) || f;
                } catch (_) { fichierFa = f; }
              }
              const somme = fa.lignes_tva.reduce((t, l) => t + (parseFloat(l.montant_ht) || 0) + (parseFloat(l.montant_tva) || 0), 0);
              const ecartFa = Math.round(((parseFloat(fa.montant_ttc) || 0) - somme) * 100) / 100;
              const avert = [];
              if (Math.abs(ecartFa) >= 0.05) avert.push(`⚠ INCOHÉRENCE : la somme des lignes (${somme.toFixed(2)} CHF) ne correspond pas au total extrait (${(parseFloat(fa.montant_ttc) || 0).toFixed(2)} CHF), écart de ${ecartFa.toFixed(2)} CHF — vérifie les lignes avant de valider.`);
              if (sigSetLot.has(signatureFacture(fa.fournisseur, fa.date_facture, fa.montant_ttc))) avert.push("⚠ Cette facture ressemble à un scan déjà créé dans bexio (même fournisseur, date et montant) — vérifie avant de valider.");
              elements.push({ data: fa, file: fichierFa, avert: avert.join(" ") });
            }
            setLot(elements);
            setLotIdx(0);
            chargerFactureLot(elements, 0);
            return;
          }

          if (!Array.isArray(parsed.lignes_tva) || parsed.lignes_tva.length === 0) {
            parsed.lignes_tva = [{ montant_ht: parsed.montant_ht || 0, taux_tva: parsed.taux_tva ?? 8.1, montant_tva: parsed.montant_tva || 0 }];
          }
          parsed.numero_interne = genererNumeroFacture();

          // Détection tickets de caisse Coop/Denner/Lidl/Aldi → mise en attente pour consolidation à la demande
          const ENSEIGNES_TICKET = ["coop", "denner", "lidl", "aldi"];
          const EXCLUSIONS_TICKET = ["genossenschaft", "coop genossenschaft"];
          const nomFournisseur = (parsed.fournisseur || "").toLowerCase();
          const estExclu = EXCLUSIONS_TICKET.some(e => nomFournisseur.includes(e));
          const estTicket = !estExclu && ENSEIGNES_TICKET.some(e => nomFournisseur.includes(e));
          if (estTicket) {
            const cleTickets = CLE_TICKETS_ATTENTE;
            const fournisseurNorm = normaliserEnseigne(parsed.fournisseur);
            const sig = signatureFacture(fournisseurNorm, parsed.date_facture, parsed.montant_ttc);
            const sigSet = chargerSignatures();
            const estPossibleDoublon = sigSet.has(sig);
            const objetTicket = {
              fournisseur: fournisseurNorm,
              date: parsed.date_facture,
              montant_ttc: parsed.montant_ttc,
              lignes_tva: parsed.lignes_tva,
              compte_suggere_code: parsed.compte_suggere_code,
              numero_interne: parsed.numero_interne,
              ts: Date.now(),
              fichier: { base64, type: f.type, name: f.name },
              possibleDoublon: estPossibleDoublon,
            };
            sigSet.add(sig);
            sauverSignatures(sigSet);
            await ajouterTicketsEnAttente(cleTickets, [objetTicket]);
            genererNumeroFacture.__annuler = true; // marqueur pour ne pas incrémenter 2 fois
            setError(estPossibleDoublon ? "Ce ticket ressemble à un scan déjà fait (même enseigne, date et montant) — marqué \"possible doublon\", vérifie avant de consolider. Il est bien ajouté à la file d'attente." : "");
            setStep(5); // écran dédié "ticket mis en attente"
            setLoading(false);
            setLoadingMsg("");
            return;
          }

          // Facture classique : avertissement (pas blocage) si même fournisseur+date+montant déjà scanné
          const sigFacture = signatureFacture(parsed.fournisseur, parsed.date_facture, parsed.montant_ttc);
          const estPossibleDoublonFacture = chargerSignatures().has(sigFacture);

          // Filet de sécurité : si Claude a quand même mélangé alcool et non-alimentaire dans une même ligne
          // (erreur récurrente malgré le prompt), on avertit pour correction manuelle plutôt que de laisser passer.
          const MOTS_ALCOOL = ["vin", "bière", "biere", "alcool", "prosecco", "champagne", "whisky", "rosé", "rose"];
          const MOTS_NON_ALIM = ["non alimentaire", "non-alimentaire", "hygiène", "hygiene", "entretien", "sac poubelle", "gobelet", "sacs poubelle"];
          const ligneMelangee = (parsed.lignes_tva || []).some(l => {
            const d = (l.description || "").toLowerCase();
            return MOTS_ALCOOL.some(m => d.includes(m)) && MOTS_NON_ALIM.some(m => d.includes(m));
          });

          // Contrôle fiable (calcul, pas une supposition du modèle) : la somme des lignes TVA doit correspondre
          // au montant_ttc annoncé. Le prompt seul n'empêche pas Claude d'oublier/dédoubler une catégorie —
          // ce calcul le détecte à coup sûr, quelle que soit la cause exacte de l'écart.
          const sommeLignesTtc = (parsed.lignes_tva || []).reduce((s, l) => s + (parseFloat(l.montant_ht) || 0) + (parseFloat(l.montant_tva) || 0), 0);
          const montantAnnonce = parseFloat(parsed.montant_ttc) || 0;
          const ecart = Math.round((montantAnnonce - sommeLignesTtc) * 100) / 100;
          const incoherent = Math.abs(ecart) >= 0.05;

          setData(parsed);
          setSelectedAccount(accounts.find(a => a.code === parsed.compte_suggere_code) || null);
          setPaymentMode(parsed.reference_qr ? "QR" : parsed.iban ? "IBAN" : "MANUAL");
          const avertissements = [];
          if (incoherent) avertissements.push(`⚠ INCOHÉRENCE DÉTECTÉE : la somme des lignes (${sommeLignesTtc.toFixed(2)} CHF) ne correspond pas au total extrait (${montantAnnonce.toFixed(2)} CHF), écart de ${ecart.toFixed(2)} CHF. Une catégorie a probablement été oubliée ou dédoublée — vérifie chaque ligne contre la facture papier avant de valider.`);
          if (ligneMelangee) avertissements.push("⚠ Une ligne semble mélanger boissons alcoolisées et articles non-alimentaires — vérifie et sépare-la manuellement si besoin (compte 4200 pour l'alcool).");
          if (estPossibleDoublonFacture) avertissements.push("⚠ Cette facture ressemble à un scan déjà créé dans bexio (même fournisseur, date et montant) — vérifie avant de valider.");
          setError(avertissements.join(" "));
          setStep(3);
        } catch (e) {
          setError("Erreur d'extraction : " + e.message);
        } finally {
          setLoading(false);
          setLoadingMsg("");
        }
      }

      // Charge la facture i du lot dans l'écran de revue ; le n° interne est attribué à ce moment-là
      // (compteur mensuel actuel), donc pas de numéro "brûlé" si tu abandonnes le lot en cours de route.
      function chargerFactureLot(arr, i) {
        const el = arr[i];
        if (!el) return;
        const d = { ...el.data, numero_interne: genererNumeroFacture() };
        setLotIdx(i);
        setData(d);
        setFile(el.file);
        setResult(null);
        setSelectedAccount(accounts.find(a => a.code === d.compte_suggere_code) || null);
        setPaymentMode(d.reference_qr ? "QR" : d.iban ? "IBAN" : "MANUAL");
        const prefixe = arr.length > 1 ? `Facture ${i + 1}/${arr.length} du lot. ` : "";
        setError(el.avert ? prefixe + el.avert : "");
        setStep(3);
        setLoading(false);
        setLoadingMsg("");
      }

      function totals(d) {
        const lignes = d?.lignes_tva || [];
        const ht = lignes.reduce((s, l) => s + (parseFloat(l.montant_ht) || 0), 0);
        const tva = lignes.reduce((s, l) => s + (parseFloat(l.montant_tva) || 0), 0);
        return { ht, tva, ttc: ht + tva };
      }

      function updateLigne(i, patch) {
        setData(d => {
          const lignes = d.lignes_tva.map((l, idx) => (idx === i ? { ...l, ...patch } : l));
          return { ...d, lignes_tva: lignes };
        });
      }

      function ligneTauxChange(i, taux) {
        updateLigne(i, { taux_tva: taux, montant_tva: Math.round(((data.lignes_tva[i].montant_ht || 0) * taux) / 100 * 100) / 100 });
      }

      function addLigne() {
        setData(d => ({ ...d, lignes_tva: [...d.lignes_tva, { montant_ht: 0, taux_tva: 8.1, montant_tva: 0 }] }));
      }

      function removeLigne(i) {
        setData(d => ({ ...d, lignes_tva: d.lignes_tva.filter((_, idx) => idx !== i) }));
      }

      async function createInBexio(dataOverride, accountOverride, paymentOverride, filesOverride) {
        const d = dataOverride || data;
        const acc = accountOverride !== undefined ? accountOverride : selectedAccount;
        const pm = paymentOverride || paymentMode;
        if (!d || !token) return;
        setLoading(true);
        setError("");
        setUploadError("");
        try {
          let contactId = null;
          setLoadingMsg("Recherche fournisseur…");
          const sr = await fetch(`${BEXIO_BASE}/contact/search`, {
            method: "POST",
            headers: { "x-bexio-token": token, "Content-Type": "application/json", Accept: "application/json" },
            body: JSON.stringify([{ field: "name_1", value: d.fournisseur, criteria: "like" }]),
          });
          if (sr.ok) { const c = await sr.json(); if (c?.length > 0) contactId = c[0].id; }
          if (!contactId) {
            setLoadingMsg("Création fournisseur…");
            const cc = await fetch(`${BEXIO_BASE}/contact`, {
              method: "POST",
              headers: { "x-bexio-token": token, "Content-Type": "application/json", Accept: "application/json" },
              body: JSON.stringify({ contact_type_id: 2, name_1: d.fournisseur, owner_id: 1, user_id: 1 }),
            });
            if (cc.ok) { const c = await cc.json(); contactId = c.id; }
          }
          if (!contactId) throw new Error("Impossible de déterminer le fournisseur dans bexio");

          setLoadingMsg("Paramètres bexio…");
          let taxRates = [];
          const tr = await fetch(`/bexio-proxy?path=/3.0/taxes`, { headers: { "x-bexio-token": token, Accept: "application/json" } });
          if (tr.ok) taxRates = await tr.json();
          const findTaxId = (rate) => {
            const matches = taxRates.filter(t => t.is_active && Math.abs(parseFloat(t.value) - parseFloat(rate)) < 0.01);
            if (matches.length === 0) return null;
            const isImportCode = t => /import|douan/i.test(t.type || "") || /import|douan/i.test(t.name || t.display_name || "");
            const pool = matches.filter(t => !isImportCode(t));
            const finalPool = pool.length > 0 ? pool : matches;
            const material = finalPool.find(t => t.type === "pre_tax_material");
            const investment = finalPool.find(t => t.type === "pre_tax_investment");
            return (material || investment || finalPool[0]).id;
          };
          let accountId = acc?.id || null;
          if (!accountId && acc?.code) {
            const ar = await fetch(`${BEXIO_BASE}/accounts`, { headers: { "x-bexio-token": token, Accept: "application/json" } });
            if (ar.ok) { const aa = await ar.json(); const m = aa.find(a => a.account_no === acc.code); if (m) accountId = m.id; }
          }

          let dateFormatted = new Date().toISOString().split("T")[0];
          if (d.date_facture) { const p = d.date_facture.split("."); if (p.length === 3) dateFormatted = `${p[2]}-${p[1]}-${p[0]}`; }
          const dueDate = new Date(dateFormatted);
          dueDate.setDate(dueDate.getDate() + 30);
          let dueDateFormatted = dueDate.toISOString().split("T")[0];
          if (d.date_echeance) {
            const p = d.date_echeance.split(".");
            if (p.length === 3) dueDateFormatted = `${p[2]}-${p[1]}-${p[0]}`;
          }

          // Attachement PJ — converti en PDF puis envoyé au stockage de fichiers bexio (v3, multipart) pour obtenir l'attachment_id
          // Supporte plusieurs fichiers (ex : consolidation de plusieurs tickets de caisse)
          let attachmentIds = [];
          let pjOk = false;
          try {
            setLoadingMsg("Conversion PDF et envoi du/des fichier(s)…");
            const filesToAttach = filesOverride && filesOverride.length > 0
              ? filesOverride.map(fi => ({
                  blob: new Blob([Uint8Array.from(atob(fi.base64), c => c.charCodeAt(0))], { type: fi.type }),
                  name: fi.name,
                }))
              : [{ blob: file, name: file.name }];

            let echecsConsecutifs = 0;
            let dernierMessageErreur = "";
            for (const fi of filesToAttach) {
              let pdfBlob, attachName;
              if (fi.blob.type === "application/pdf") {
                pdfBlob = fi.blob;
                attachName = fi.name;
              } else {
                const pdfBase64 = await convertImageToPdf(fi.blob);
                pdfBlob = new Blob([Uint8Array.from(atob(pdfBase64), c => c.charCodeAt(0))], { type: "application/pdf" });
                attachName = fi.name.replace(/\.[^.]+$/, "") + ".pdf";
              }
              if (fi.blob.type === "application/pdf" && fi.blob.size > LIMITE_BEXIO_OCTETS) {
                setLoadingMsg(`Le fichier "${attachName}" dépasse la limite bexio — recompression automatique…`);
                pdfBlob = await compresserPdfSiNecessaire(pdfBlob);
              }
              const formData = new FormData();
              // Contrôle final : si même après recompression automatique ça dépasse encore la limite bexio
              // (cas rare, ex : document de très nombreuses pages), on prévient clairement plutôt que d'échouer en silence.
              if (pdfBlob.size > LIMITE_BEXIO_OCTETS) {
                dernierMessageErreur = `"${attachName}" fait toujours ${(pdfBlob.size / 1024 / 1024).toFixed(1)} Mo même après recompression automatique — trop volumineux pour bexio (limite ~9 Mo).`;
                setUploadError(dernierMessageErreur);
                echecsConsecutifs++;
                if (echecsConsecutifs >= 3) {
                  setError(`Envoi des pièces jointes interrompu après ${echecsConsecutifs} échecs consécutifs — ${dernierMessageErreur}`);
                  break;
                }
                continue;
              }
              formData.append("file", pdfBlob, attachName);
              let fr;
              try {
                fr = await fetchAvecRetry(`/bexio-proxy?path=/3.0/files`, {
                  method: "POST",
                  headers: { "x-bexio-token": token, Accept: "application/json" },
                  body: formData,
                });
              } catch (eReseau) {
                dernierMessageErreur = `Coupure réseau pendant l'envoi de "${attachName}" : ${eReseau.message}`;
                setUploadError(dernierMessageErreur);
                echecsConsecutifs++;
                if (echecsConsecutifs >= 3) {
                  setError(`Envoi des pièces jointes interrompu après ${echecsConsecutifs} échecs consécutifs — ${dernierMessageErreur}`);
                  break;
                }
                continue;
              }
              if (fr.ok) {
                const fdata = await fr.json();
                const f0 = Array.isArray(fdata) ? fdata[0] : fdata;
                const fid = f0?.uuid || f0?.id;
                if (fid) { attachmentIds.push(fid); pjOk = true; echecsConsecutifs = 0; }
                else { dernierMessageErreur = "Pas d'id dans la réponse — " + JSON.stringify(fdata); setUploadError(dernierMessageErreur); echecsConsecutifs++; }
              } else {
                const errText = await fr.text();
                dernierMessageErreur = `(${fr.status}) ${errText}`;
                setUploadError(dernierMessageErreur);
                echecsConsecutifs++;
              }
              // Circuit breaker : après 3 échecs d'affilée, on arrête d'insister (évite 50+ requêtes vouées à échouer)
              // et on remonte l'erreur réelle de bexio pour comprendre pourquoi, au lieu de la laisser dans la console.
              if (echecsConsecutifs >= 3) {
                setError(`Envoi des pièces jointes interrompu après ${echecsConsecutifs} échecs consécutifs — bexio répond : ${dernierMessageErreur}`);
                break;
              }
            }
          } catch (e) {
            console.error("Upload fichier échoué:", e);
            setUploadError(e.message);
          }

          setLoadingMsg("Création de la facture…");
          const lignes = d.lignes_tva.filter(l => parseFloat(l.montant_ht) !== 0);
          const resolveAccountId = (code) => {
            if (!code) return accountId;
            const found = accounts.find(a => a.code === code);
            return found ? found.id : accountId;
          };
          const r2 = n => Math.round((parseFloat(n) || 0) * 100) / 100;
          const payload = {
            supplier_id: contactId,
            contact_partner_id: contactId,
            vendor_ref: d.numero_interne,
            title: d.fournisseur.slice(0, 80),
            bill_date: dateFormatted,
            due_date: dueDateFormatted,
            manual_amount: true,
            amount_man: r2(totals(d).ttc),
            currency_code: d.devise || "CHF",
            item_net: true,
            attachment_ids: attachmentIds,
            address: {
              lastname_company: d.fournisseur,
              type: "COMPANY",
            },
            line_items: lignes.map((l, i) => ({
              position: i + 1,
              title: (lignes.length > 1 ? `${l.compte_libelle || d.description || d.fournisseur} (TVA ${l.taux_tva}%)` : (d.description || d.fournisseur)).slice(0, 80) || d.fournisseur.slice(0, 80),
              tax_id: findTaxId(l.taux_tva),
              amount: r2(l.montant_ht),
              booking_account_id: resolveAccountId(l.compte_code),
            })),
            discounts: [],
            payment: {
              type: pm,
              execution_date: dateReglement,
              amount: r2(totals(d).ttc),
              salary_payment: false,
              ...(pm === "IBAN" && d.iban ? { iban: d.iban.replace(/\s/g, ""), name: d.fournisseur.slice(0, 70) } : {}),
              ...(pm === "QR" && d.reference_no ? { reference_no: d.reference_qr } : {}),
            },
          };
          const ir = await fetch(`/bexio-proxy?path=/4.0/purchase/bills`, {
            method: "POST",
            headers: { "x-bexio-token": token, "Content-Type": "application/json", Accept: "application/json" },
            body: JSON.stringify(payload),
          });
          if (!ir.ok) { const err = await ir.text(); throw new Error(`bexio ${ir.status}: ${err}`); }
          const inv = await ir.json();

          syncCompteurDepuisNumero(d.numero_interne);
          const sigSet = chargerSignatures();
          sigSet.add(signatureFacture(d.fournisseur, d.date_facture, d.montant_ttc));
          sauverSignatures(sigSet);
          setResult({ id: inv.id, url: `https://office.bexio.com/purchase/bills`, pjOk, numeroInterne: d.numero_interne });
          setStep(4);
        } catch (e) {
          setError("Erreur bexio : " + e.message);
          throw e;
        } finally {
          setLoading(false);
          setLoadingMsg("");
        }
      }

      function reset() { setLot([]); setLotIdx(0); setStep(2); setData(null); setFile(null); setOriginalFile(null); setPages([]); setPreview(null); setScanInfo(""); setResult(null); setError(""); }

      const S = {
