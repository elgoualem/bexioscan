        btnGhost: { background: "transparent", border: "1px solid #3A5073", borderRadius: 14, padding: "0 18px", color: "#E8EEF7", fontFamily: "inherit", fontSize: 15, fontWeight: 600, cursor: "pointer", minHeight: 52 },
        btnLink: { display: "flex", alignItems: "center", justifyContent: "center", gap: 10, background: "#F5A524", borderRadius: 14, padding: "0 26px", color: "#1A1200", fontFamily: "inherit", fontSize: 16, fontWeight: 700, textDecoration: "none", marginTop: 18, minHeight: 56 },
        hint: { fontSize: 14, color: "#B8C6DB", marginTop: 10, textAlign: "center", lineHeight: 1.5 },
        link: { color: "#F5A524", textDecoration: "none", fontWeight: 500 },
        error: { color: "#FCA5A5", fontSize: 13, lineHeight: 1.5, background: "#3A1414", border: "1px solid #7F1D1D", borderRadius: 12, padding: "12px 14px", marginTop: 12 },
        dropzone: { border: "2px dashed", borderRadius: 20, padding: "34px 16px", cursor: "pointer", transition: "border-color 0.3s", marginBottom: 14, textAlign: "center", background: "#121C33" },
        grid: { display: "grid", gridTemplateColumns: "1fr 1fr", gap: "18px 14px", marginBottom: 18, padding: "20px", background: "#121C33", borderRadius: 16, border: "1px solid #2F4468" },
        card2: { background: "#121C33", border: "1px solid #2F4468", borderRadius: 16 },
        badge: { fontSize: 12, fontWeight: 700, padding: "6px 12px", borderRadius: 20, letterSpacing: "0.04em", textTransform: "uppercase" },
        successIcon: { width: 76, height: 76, borderRadius: "50%", background: "#0F3B2E", border: "2px solid #34D399", color: "#6EE7B7", display: "flex", alignItems: "center", justifyContent: "center", margin: "0 auto" },
      };

      return (
        <div style={S.root}>
          {/* Header */}
          <div style={S.header}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                <div style={{ width: 36, height: 36, borderRadius: 10, background: "#F5A524", color: "#1A1200", display: "flex", alignItems: "center", justifyContent: "center" }}><IcoScan s={22} /></div>
                <span style={{ fontSize: 21, fontWeight: 800, color: "#fff", letterSpacing: "-0.03em" }}>bexio<span style={{ color: "#F5A524" }}>scan</span></span>
              </div>
              {step > 1 && (
                <button onClick={() => setStep(1)} style={{ width: 44, height: 44, display: "flex", alignItems: "center", justifyContent: "center", background: "#1A2744", border: "1px solid #3A5073", borderRadius: 12, color: "#E8EEF7", cursor: "pointer", padding: 0 }} title="Modifier les clés" aria-label="Réglages"><IcoSliders s={20} /></button>
              )}
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(4, minmax(0, 1fr))", gap: 8 }}>
              {["Config","Facture","Revue","Créé"].map((label, i) => {
                const fait = step > i + 1, actif = step === i + 1;
                return (
                  <div key={i} style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                    <div style={{ height: 4, borderRadius: 2, background: fait ? "#34D399" : actif ? "#F5A524" : "#22314D", transition: "all 0.3s" }} />
                    <div style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 12, fontWeight: actif ? 700 : fait ? 600 : 500, color: actif ? "#fff" : fait ? "#6EE7B7" : "#9DAEC8" }}>
                      {fait ? <><IcoCheck s={12} sw={3} />{label}</> : <>{i + 1} · {label}</>}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

          {/* Indicateur tickets en attente */}
          {(() => {
            const tickets = JSON.parse(localStorage.getItem(CLE_TICKETS_ATTENTE) || "[]");
            if (tickets.length === 0) return null;
            const parEnseigne = {};
            tickets.forEach(t => {
              if (!parEnseigne[t.fournisseur]) parEnseigne[t.fournisseur] = { count: 0, total: 0 };
              parEnseigne[t.fournisseur].count++;
              parEnseigne[t.fournisseur].total += parseFloat(t.montant_ttc) || 0;
            });
            return (
              <div style={{ width: "100%", maxWidth: 520, marginBottom: 14, display: "flex", flexWrap: "wrap", gap: 8 }}>
                {Object.entries(parEnseigne).map(([enseigne, info]) => (
                  <button key={enseigne} onClick={() => setStep(5)} style={{ background: "#1A2744", border: "1px solid #3A5073", borderRadius: 19, padding: "0 14px", cursor: "pointer", display: "flex", alignItems: "center", gap: 8, minHeight: 38, color: "#FFFFFF", fontSize: 13 }}>
                    <span style={{ color: "#F5A524", display: "flex" }}><IcoReceipt s={14} /></span>
                    <span style={{ fontWeight: 700 }}>{enseigne}</span>
                    <span style={{ color: "#D3DDEC" }}>{info.count}×</span>
                    <span style={{ color: "#F5A524", fontWeight: 700 }}>{fCHF(info.total)}</span>
                  </button>
                ))}
              </div>
            );
          })()}

          <div style={S.card} className="bx-anim" key={step}>
            {/* Étape 1 — Token */}
            {step === 1 && (
              <div style={S.section}>
                <h2 style={S.title}>Connexion</h2>
                <p style={S.subtitle}>Choisis ton IA, puis renseigne tes deux clés API</p>

                <label style={S.label}>Fournisseur IA</label>
                <select value={llmProvider} onChange={e => changerFournisseur(e.target.value)} style={{ ...S.select, marginBottom: 14 }}>
                  {Object.entries(LLM_PROVIDERS).map(([id, p]) => <option key={id} value={id}>{p.label}</option>)}
                </select>

                <label style={S.label}>Modèle</label>
                <select
                  value={LLM_PROVIDERS[llmProvider].models.some(m => m[0] === llmModel) ? llmModel : MODELE_PERSO}
                  onChange={e => setLlmModel(e.target.value === MODELE_PERSO ? "" : e.target.value)}
                  style={{ ...S.select, marginBottom: 14 }}
                >
                  {LLM_PROVIDERS[llmProvider].models.map(([id, nom]) => <option key={id} value={id}>{nom}</option>)}
                  <option value={MODELE_PERSO}>Autre (saisir l'identifiant)</option>
                </select>
                {!LLM_PROVIDERS[llmProvider].models.some(m => m[0] === llmModel) && (
                  <input
                    type="text"
                    placeholder="identifiant du modèle"
                    value={llmModel}
                    onChange={e => setLlmModel(e.target.value)}
                    style={{ ...S.input, marginBottom: 14 }}
                  />
                )}

                <label style={S.label}>Clé API {LLM_PROVIDERS[llmProvider].label}</label>
                <input
                  type="password"
                  placeholder={LLM_PROVIDERS[llmProvider].keyHint}
                  value={llmKey}
                  onChange={e => setLlmKey(e.target.value)}
                  style={{ ...S.input, marginBottom: 14 }}
                />
                <p style={{ fontSize: 12, color: "#B8C6DB", marginTop: -6, marginBottom: 20 }}>
                  → <a href={LLM_PROVIDERS[llmProvider].keyUrl} target="_blank" rel="noreferrer" style={S.link}>{LLM_PROVIDERS[llmProvider].keyUrl.replace(/^https?:\/\//, "").split("/")[0]}</a>
                </p>

                <label style={S.label}>Token bexio (Personal Access Token)</label>
                <input
                  type="password"
                  placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
                  value={token}
                  onChange={e => setToken(e.target.value)}
                  onKeyDown={e => e.key === "Enter" && saveToken()}
                  style={S.input}
                />
                <p style={{ fontSize: 12, color: "#B8C6DB", marginTop: -6, marginBottom: 20 }}>
                  → <a href="https://developer.bexio.com/pat" target="_blank" rel="noreferrer" style={S.link}>developer.bexio.com/pat</a>
                </p>
                <button onClick={saveToken} disabled={!token.trim() || !llmKey.trim() || !llmModel.trim()} style={{ ...S.btn, opacity: token.trim() && llmKey.trim() && llmModel.trim() ? 1 : 0.35 }}>
                  Continuer<IcoArrow />
                </button>
                <p style={S.hint}>Clés stockées uniquement dans le navigateur.</p>

                <div style={{ borderTop: "1px solid #2F4468", margin: "26px 0 20px" }} />
                <label style={S.label}>Mois de numérotation</label>
                <div style={{ display: "flex", gap: 8 }}>
                  <select
                    value={moisActif.moisIdx}
                    onChange={e => setMoisActifState(m => ({ ...m, moisIdx: parseInt(e.target.value, 10) }))}
                    style={{ ...S.select, flex: 2 }}
                  >
                    {MOIS_FR.map((m, i) => <option key={m} value={i}>{m}</option>)}
                  </select>
                  <input
                    type="number"
                    value={moisActif.annee}
                    onChange={e => setMoisActifState(m => ({ ...m, annee: parseInt(e.target.value, 10) || m.annee }))}
                    style={{ ...S.input, flex: 1, marginBottom: 0 }}
                  />
                </div>
                <p style={S.hint}>Le libellé (ex. g{MOIS_FR[moisActif.moisIdx]}{String(moisActif.annee).slice(-2)}) ne dépend ni de la date du jour ni de la date de la facture — il reste celui choisi ici tant que tu ne le changes pas.</p>

                <label style={{ ...S.label, marginTop: 16 }}>N° de départ pour ce mois</label>
                <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                  <span style={{ color: "#F5A524", fontSize: 15, fontWeight: 600, fontFamily: MONO }}>g{MOIS_FR[moisActif.moisIdx]}{String(moisActif.annee).slice(-2)}/</span>
                  <input
                    type="number"
                    min="1"
                    placeholder="001"
                    value={numeroDepart}
                    onChange={e => setNumeroDepart(e.target.value)}
                    style={{ ...S.input, width: 90, marginBottom: 0 }}
                  />
                  <button
                    onClick={() => {
                      const n = parseInt(numeroDepart, 10);
                      if (n > 0) {
                        const anneeFull = moisActif.annee < 100 ? 2000 + moisActif.annee : moisActif.annee;
                        setMoisActifState(m => ({ ...m, annee: anneeFull }));
                        setMoisActif(moisActif.moisIdx, anneeFull);
                        const cle = `bx_compteur_${anneeFull}-${String(moisActif.moisIdx + 1).padStart(2, "0")}`;
                        localStorage.setItem(cle, String(n - 1));
                        setNumeroDepart("");
                      }
                    }}
                    disabled={!numeroDepart}
                    style={{ ...S.btn, width: "auto", marginTop: 0, padding: "0 20px", minHeight: 52, fontSize: 15, background: "transparent", border: "1px solid #F5A524", color: "#F5A524", opacity: numeroDepart ? 1 : 0.35 }}
                  >
                    Fixer
                  </button>
                </div>
                <p style={S.hint}>La prochaine facture portera ce numéro pour le mois choisi ci-dessus, puis la suite s'incrémente seule — quelle que soit la date réelle du scan.</p>
              </div>
            )}

            {/* Étape 2 — Upload */}
            {step === 2 && (
              <div style={S.section}>
                <h2 style={S.title}>Importer la facture</h2>
                <p style={S.subtitle}>Image ou PDF — QR-facture supportée</p>
                <div
                  style={{ ...S.dropzone, borderColor: (file || pages.length) ? "#F5A524" : "#2a3a58", cursor: "pointer" }}
                  onDragOver={e => e.preventDefault()}
                  onDrop={onDrop}
                  onClick={() => fileRef.current.click()}
                >
                  {file && pages.length === 0 ? (
                    <div>
                      <div style={{ marginBottom: 12, color: "#F5A524", display: "flex", justifyContent: "center" }}><IcoFile s={44} /></div>
                      <p style={{ color: "#ffffff", fontSize: 14, fontWeight: 600, margin: 0, overflowWrap: "anywhere" }}>{file.name}</p>
                      <p style={{ color: "#D3DDEC", fontSize: 12, marginTop: 6, marginBottom: 0 }}>Touche pour changer</p>
                    </div>
                  ) : pages.length > 0 ? (
                    <div style={{ display: "flex", flexWrap: "wrap", gap: 8, justifyContent: "center" }} onClick={e => e.stopPropagation()}>
                      {pages.map((p, i) => (
                        <div key={p.id} style={{ position: "relative", width: 92 }}>
                          <img src={p.url} alt="" style={{ width: 92, height: 124, objectFit: "cover", borderRadius: 8, border: "1px solid #3A5073", opacity: p.processing ? 0.4 : 1, display: "block" }} />
                          <span style={{ position: "absolute", bottom: 4, left: 4, background: "#0a1220dd", color: "#fff", fontSize: 11, fontWeight: 600, padding: "1px 7px", borderRadius: 6 }}>{i + 1}</span>
                          <button onClick={() => removePage(p.id)} aria-label="Retirer la page" style={{ position: "absolute", top: -18, right: -18, width: 44, height: 44, padding: 0, border: "none", background: "transparent", display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer" }}><span style={{ width: 26, height: 26, borderRadius: 13, background: "#EF4444", border: "2px solid #121C33", color: "#fff", display: "flex", alignItems: "center", justifyContent: "center" }}><IcoX s={12} sw={3} /></span></button>
                        </div>
                      ))}
                      <div onClick={() => fileRef.current.click()} style={{ width: 92, height: 124, borderRadius: 8, border: "2px dashed #3A5073", display: "flex", alignItems: "center", justifyContent: "center", color: "#D3DDEC", fontSize: 28, cursor: "pointer" }}><IcoPlus s={28} /></div>
                    </div>
                  ) : (
                    <div>
                      <div style={{ width: 60, height: 60, borderRadius: "50%", background: "#F5A5241f", border: "1px solid #F5A52466", color: "#F5A524", fontSize: 28, display: "flex", alignItems: "center", justifyContent: "center", margin: "0 auto 14px" }}><IcoUp s={28} /></div>
                      <p style={{ color: "#fff", fontSize: 16, fontWeight: 600, margin: "0 0 4px" }}>Choisir une facture</p>
                      <p style={{ color: "#B8C6DB", fontSize: 13, lineHeight: 1.5, margin: 0 }}>Photo ou PDF · glisser-déposer possible</p>
                    </div>
                  )}
                </div>
                {pages.length > 0 && (
                  <p style={{ color: "#B8C6DB", fontSize: 12, textAlign: "center", margin: "8px 0 0" }}>
                    {pages.length > 1 ? `${pages.length} pages — ` : ""}touche "+" pour ajouter une page
                  </p>
                )}
                {scanInfo && (
                  <p style={{ color: "#D3DDEC", fontSize: 13, textAlign: "center", margin: "10px 0 0" }}>
                    {scanInfo}
                    {pages.length > 0 && pages[pages.length - 1].raw && (
                      <button onClick={useOriginalPhoto} style={{ background: "none", border: "none", color: "#F5A524", fontSize: 13, textDecoration: "underline", cursor: "pointer", marginLeft: 6, padding: 0 }}>
                        Utiliser l'originale
                      </button>
                    )}
                  </p>
                )}
                {error && <p style={S.error}>{error}</p>}
                <input
                  ref={fileRef}
                  type="file"
                  accept="image/*,application/pdf"
                  capture="environment"
                  style={{ display: "none" }}
                  onChange={e => handleFile(e.target.files[0])}
                />
                <button onClick={startAnalysis} disabled={(!file && pages.length === 0) || loading || scanning} style={{ ...S.btn, opacity: (file || pages.length) && !loading && !scanning ? 1 : 0.35 }}>
                  {scanning ? "Détection des bords…" : loading ? loadingMsg : <>Analyser avec Claude<IcoArrow /></>}
                </button>
              </div>
            )}

            {/* Étape 3 — Revue */}
            {step === 3 && data && (
              <div style={S.section}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
                  <h2 style={S.title}>Vérification</h2>
                  <div style={{ ...S.badge, background: data.confiance === "haute" ? "#0F3B2E" : data.confiance === "moyenne" ? "#3D2E0B" : "#3A1414", color: data.confiance === "haute" ? "#6EE7B7" : data.confiance === "moyenne" ? "#FCD34D" : "#FCA5A5" }}>
                    Confiance {data.confiance}
                  </div>
                </div>
                <div style={S.grid}>
                  <div style={{ gridColumn: "1 / -1" }}>
                    <div style={MINI_LABEL}>N° interne</div>
                    <input
                      type="text"
                      value={data.numero_interne || ""}
                      onChange={e => setData(d => ({ ...d, numero_interne: e.target.value }))}
                      style={{ ...S.input, marginBottom: 0, color: "#F5A524", fontWeight: 600, fontFamily: MONO, fontSize: 16 }}
                    />
                  </div>
                  <Field label="Fournisseur" value={data.fournisseur} />
                  <div style={{ gridColumn: "auto" }}>
                    <div style={MINI_LABEL}>N° facture fournisseur</div>
                    <input
                      type="text"
                      value={data.numero_facture || ""}
                      onChange={e => setData({ ...data, numero_facture: e.target.value })}
                      style={{ ...S.input, marginBottom: 0, fontSize: 15 }}
                      placeholder="ex: 87729831"
                    />
                  </div>
                  <div>
                    <div style={MINI_LABEL}>Date</div>
                    <input
                      type="date"
                      value={(() => { const p = (data.date_facture || "").split("."); return p.length === 3 ? `${p[2]}-${p[1]}-${p[0]}` : ""; })()}
                      onChange={e => {
                        const [y, m, day] = e.target.value.split("-");
                        setData(d => ({ ...d, date_facture: y ? `${day}.${m}.${y}` : "" }));
                      }}
                      style={{ ...S.input, marginBottom: 0, fontSize: 15 }}
                    />
                  </div>
                  {data.date_echeance && <Field label="Échéance" value={data.date_echeance} accent />}
                  {data.date_reglement && <Field label="Règlement" value={data.date_reglement} />}
                  <Field label="Devise" value={data.devise} />
                  <Field label="Description" value={data.description} span />
                  {data.reference_qr && <Field label="Réf. QR" value={data.reference_qr} span />}
                  {data.iban && <Field label="IBAN" value={data.iban} span />}
                </div>
                <div style={{ marginBottom: 14 }}>
                  <label style={S.label}>
                    Ligne(s) TVA {data.lignes_tva.length > 1 ? `(${data.lignes_tva.length} taux différents)` : ""}
                  </label>
                  {data.lignes_tva.map((l, i) => (
                    <div key={i} style={{ ...S.card2, display: "grid", gridTemplateColumns: "1fr 1fr", gap: "14px 12px", marginBottom: 12, padding: 14 }}>
                      {data.lignes_tva.length > 1 && (
                        <div style={{ gridColumn: "1 / -1", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                          <span style={{ ...MINI_LABEL, marginBottom: 0, color: "#F5A524" }}>Ligne {i + 1}</span>
                          <button onClick={() => removeLigne(i)} aria-label="Supprimer la ligne" style={{ width: 44, height: 44, margin: "-8px -10px -8px 0", padding: 0, background: "transparent", border: "none", color: "#F87171", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" }}><IcoX s={18} /></button>
                        </div>
                      )}
                      <div style={{ gridColumn: "1 / -1", minWidth: 0 }}>
                        <div style={MINI_LABEL}>Compte</div>
                        <select
                          value={l.compte_code || data.compte_suggere_code || ""}
                          onChange={e => {
                            const nouveauCompte = e.target.value;
                            const compteInfo = accounts.find(a => a.code === nouveauCompte);
                            apprendreCorrection(data.fournisseur, l.description || data.description, l.compte_code || data.compte_suggere_code, nouveauCompte, compteInfo?.label);
                            updateLigne(i, { compte_code: nouveauCompte });
                          }}
                          style={S.select}
                        >
                          <option value="">— compte global —</option>
                          {accounts.map(a => <option key={a.code} value={a.code}>{a.code} – {a.label}</option>)}
                        </select>
                        {l.description && <div style={{ fontSize: 12, color: "#B8C6DB", marginTop: 6, lineHeight: 1.4 }}>{l.description}</div>}
                      </div>
                      <div style={{ minWidth: 0 }}>
                        <div style={MINI_LABEL}>Montant HT</div>
                        <input
                          type="number" step="0.01" inputMode="decimal" value={l.montant_ht}
                          onChange={e => updateLigne(i, { montant_ht: parseFloat(e.target.value) || 0, montant_tva: Math.round(((parseFloat(e.target.value) || 0) * l.taux_tva) / 100 * 100) / 100 })}
                          style={{ ...S.input, marginBottom: 0, fontSize: 15 }}
                        />
                      </div>
                      <div style={{ minWidth: 0 }}>
                        <div style={MINI_LABEL}>Taux TVA</div>
                        <select value={l.taux_tva} onChange={e => ligneTauxChange(i, parseFloat(e.target.value))} style={S.select}>
                          {TVA_CH.map(t => <option key={t.taux} value={t.taux}>{t.label}</option>)}
                        </select>
                      </div>
                      <div style={{ gridColumn: "1 / -1", display: "flex", justifyContent: "space-between", alignItems: "baseline", paddingTop: 12, borderTop: "1px solid #2F4468" }}>
                        <span style={{ ...MINI_LABEL, marginBottom: 0 }}>Montant TVA</span>
                        <span style={{ fontSize: 17, fontWeight: 700, color: "#F5A524" }}>{fCHF(l.montant_tva)}</span>
                      </div>
                    </div>
                  ))}
                  <button onClick={addLigne} style={{ width: "100%", background: "none", border: "2px dashed #3A5073", color: "#E8EEF7", fontSize: 14, fontWeight: 500, borderRadius: 12, padding: "12px 10px", cursor: "pointer", minHeight: 46 }}>
                    + Ajouter un taux de TVA
                  </button>
                </div>
                <div style={{ ...S.card2, padding: "6px 18px", marginBottom: 18 }}>
                  {[["Total HT", totals(data).ht, false], ["Total TVA", totals(data).tva, false], ["Total TTC", totals(data).ttc, true]].map(([lib, val, fort], i) => (
                    <div key={lib} style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", padding: fort ? "14px 0 12px" : "12px 0", borderTop: i ? "1px solid #2F4468" : "none" }}>
                      <span style={{ fontSize: fort ? 14 : 13, fontWeight: fort ? 700 : 500, color: fort ? "#fff" : "#D3DDEC" }}>{lib}</span>
                      <span style={{ fontSize: fort ? 22 : 15, fontWeight: 700, color: fort ? "#F5A524" : "#fff", letterSpacing: "-0.01em" }}>{fCHF(val)}</span>
                    </div>
                  ))}
                </div>
                {Math.abs(totals(data).ttc - (parseFloat(data.montant_ttc) || 0)) >= 0.05 && (
                  <p style={{ ...S.error, marginTop: -6, marginBottom: 18 }}>
                    <IcoAlert s={16} />La somme des lignes ci-dessus ({fCHF(totals(data).ttc)}) ne correspond pas au total lu sur le document ({fCHF(data.montant_ttc)}) — vérifie chaque ligne contre la facture papier avant de créer l'écriture.
                  </p>
                )}
                <div style={{ marginBottom: 18 }}>
                  <label style={S.label}>Compte de charge par défaut <span style={{ color: "#B8C6DB", fontWeight: 400, textTransform: "none", letterSpacing: 0 }}>— utilisé si une ligne n'a pas de compte propre</span></label>
                  <select value={selectedAccount?.code || ""} onChange={e => setSelectedAccount(accounts.find(a => a.code === e.target.value) || null)} style={S.select}>
                    <option value="">— Choisir un compte —</option>
                    {accounts.map(a => <option key={a.code} value={a.code}>{a.code} – {a.label}</option>)}
                  </select>
                </div>
                <div style={{ marginBottom: 18 }}>
                  <label style={S.label}>Date de règlement (paiement effectif)</label>
                  <input type="date" value={dateReglement} onChange={e => { if (e.target.value) setDateReglement(e.target.value); }} style={{ ...S.input, marginBottom: 0 }} />
                </div>
                <div style={{ marginBottom: 18 }}>
                  <label style={S.label}>Mode de paiement</label>
                  <select value={paymentMode} onChange={e => setPaymentMode(e.target.value)} style={S.select}>
                    <option value="QR">QR-facture (virement QR)</option>
                    <option value="IBAN">Virement IBAN</option>
                    <option value="MANUAL">Manuel (cash / CB / TWINT / chèque)</option>
                  </select>
                </div>
                {error && <p style={S.error}>{error}</p>}
                <div style={{ display: "flex", gap: 10, marginTop: 24, alignItems: "stretch" }}>
                  <button onClick={reset} style={S.btnGhost}>Recommencer</button>
                  <button onClick={() => createInBexio()} disabled={!selectedAccount || loading} style={{ ...S.btn, flex: 1, marginTop: 0, opacity: selectedAccount && !loading ? 1 : 0.35 }}>
                    {loading ? loadingMsg : <>Créer l'écriture<IcoArrow /></>}
                  </button>
                </div>
              </div>
            )}

            {/* Étape 4 — Succès */}
            {step === 4 && result && (
              <div style={{ ...S.section, textAlign: "center" }}>
                <div style={S.successIcon}><IcoCheck s={36} sw={2.6} /></div>
                <h2 style={{ ...S.title, marginTop: 18 }}>Écriture créée !</h2>
                <p style={S.subtitle}>Facture fournisseur enregistrée dans bexio.</p>
                <div style={{ ...S.card2, display: "flex", flexDirection: "column", gap: 12, padding: 18, margin: "20px 0 0", textAlign: "left" }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                    <span style={{ color: "#D3DDEC", fontSize: 13 }}>N° interne</span>
                    <span style={{ color: "#F5A524", fontFamily: MONO, fontSize: 17, fontWeight: 700 }}>{result.numeroInterne}</span>
                  </div>
                  <div style={{ borderTop: "1px solid #2F4468", paddingTop: 12, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                    <span style={{ color: "#D3DDEC", fontSize: 13 }}>ID bexio</span>
                    <span style={{ color: "#F5A524", fontFamily: MONO, fontSize: 17, fontWeight: 700 }}>#{result.id}</span>
                  </div>
                  <div style={{ borderTop: "1px solid #2F4468", paddingTop: 12, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                    <span style={{ color: "#D3DDEC", fontSize: 13 }}>Pièce jointe</span>
                    <span style={{ display: "flex", alignItems: "center", gap: 6, height: 30, padding: "0 12px", borderRadius: 15, fontSize: 13, fontWeight: 700, background: result.pjOk ? "#0F3B2E" : "#3A1414", color: result.pjOk ? "#6EE7B7" : "#FCA5A5" }}>
                      {result.pjOk ? <><IcoCheck s={14} sw={3} />Attachée</> : <><IcoAlert s={14} inline={false} />Non attachée</>}
                    </span>
                  </div>
                  {!result.pjOk && (
                    <p style={{ color: "#B8C6DB", fontSize: 12, lineHeight: 1.5, margin: 0 }}>
                      L'écriture est créée. Attache manuellement la facture depuis bexio si nécessaire.
                    </p>
                  )}
                  {uploadError && (
                    <p style={{ color: "#FCA5A5", fontSize: 11, wordBreak: "break-all", margin: 0, borderTop: "1px solid #2F4468", paddingTop: 10 }}>
                      {uploadError}
                    </p>
                  )}
                </div>
                <a href={result.url} target="_blank" rel="noreferrer" style={S.btnLink}>Voir dans bexio<IcoExt s={18} /></a>
                <br />
                {lot.length > 0 && lotIdx + 1 < lot.length && (
                  <button onClick={() => chargerFactureLot(lot, lotIdx + 1)} style={{ ...S.btn, marginTop: 14 }}>
                    Facture suivante ({lotIdx + 2}/{lot.length})<IcoArrow />
                  </button>
                )}
                <button onClick={reset} style={{ ...S.btnGhost, marginTop: 14, width: "100%" }}>Scanner une autre facture</button>
              </div>
            )}
            {/* Étape 5 — Ticket mis en attente */}
            {step === 5 && (() => {
              const cleTickets = CLE_TICKETS_ATTENTE;
              const tickets = JSON.parse(localStorage.getItem(cleTickets) || "[]");
              const parEnseigne = {};
              tickets.forEach(t => {
                const k = t.fournisseur;
                if (!parEnseigne[k]) parEnseigne[k] = { total: 0, count: 0, lignes: {}, possiblesDoublons: 0 };
                parEnseigne[k].total += parseFloat(t.montant_ttc) || 0;
                parEnseigne[k].count++;
                if (t.possibleDoublon) parEnseigne[k].possiblesDoublons++;
                (t.lignes_tva || []).forEach(l => {
                  const compte = l.compte_code || t.compte_suggere_code || "4200";
                  const lk = `${compte}|${l.taux_tva}`;
                  if (!parEnseigne[k].lignes[lk]) parEnseigne[k].lignes[lk] = { compte_code: compte, taux_tva: l.taux_tva, description: l.description || "", montant_ht: 0 };
                  parEnseigne[k].lignes[lk].montant_ht += parseFloat(l.montant_ht) || 0;
                });
              });

              async function viderFileAttente() {
                if (!confirm(`Vider toute la file d'attente (${tickets.length} ticket(s)) ? Cette action est irréversible.`)) return;
                await Promise.all(tickets.map(t => t.ficId ? idbDeleteFichier(t.ficId) : Promise.resolve()));
                localStorage.removeItem(cleTickets);
                setStep(2);
              }

              async function dedupliquerTickets() {
                const vus = new Set();
                const aSupprimer = [];
                const conserves = tickets.filter(t => {
                  const sig = signatureFacture(t.fournisseur, t.date, t.montant_ttc);
                  if (vus.has(sig)) { aSupprimer.push(t); return false; }
                  vus.add(sig);
                  return true;
                });
                if (aSupprimer.length === 0) { alert("Aucun doublon exact trouvé (même fournisseur+date+montant)."); return; }
                if (!confirm(`${aSupprimer.length} doublon(s) exact(s) trouvé(s) (même fournisseur+date+montant). Les supprimer de la file ?`)) return;
                await Promise.all(aSupprimer.map(t => t.ficId ? idbDeleteFichier(t.ficId) : Promise.resolve()));
                localStorage.setItem(cleTickets, JSON.stringify(conserves.map(t => { const { possibleDoublon, ...rest } = t; return rest; })));
                setStep(2);
                setStep(5);
              }

              async function consoliderMois() {
                if (tickets.length === 0) return;
                setLoading(true);
                setLoadingMsg("Consolidation en cours…");
                try {
                  for (const [enseigne, info] of Object.entries(parEnseigne)) {
                    const ticketsEnseigne = tickets.filter(t => t.fournisseur === enseigne);
                    const lignesGroupees = {};
                    ticketsEnseigne.forEach(t => (t.lignes_tva || []).forEach(l => {
                      const compteBase = l.compte_code || t.compte_suggere_code || "4200";
                      const compte = comptesTicketsOverrides[`${enseigne}|${compteBase}|${l.taux_tva}`] || compteBase;
                      const k = `${compte}|${l.taux_tva}`;
                      if (!lignesGroupees[k]) lignesGroupees[k] = { taux_tva: l.taux_tva, compte_code: compte, compte_libelle: l.compte_libelle, montant_ht: 0, montant_tva: 0 };
                      lignesGroupees[k].montant_ht += parseFloat(l.montant_ht) || 0;
                      lignesGroupees[k].montant_tva += parseFloat(l.montant_tva) || 0;
                    }));
                    let dc = new Date(dateConsolidation);
                    if (isNaN(dc.getTime())) {
                      // Date invalide (ex: 30 février) → on se rabat sur le dernier jour valide du mois saisi
                      const [y, m] = (dateConsolidation || "").split("-").map(Number);
                      dc = (y && m) ? new Date(y, m, 0) : new Date();
                    }
                    if (dc.getFullYear() < 100) {
                      // Bug du input date natif : année tapée sur 2 chiffres → interprétée comme l'an 0026 au lieu de 2026
                      dc = new Date(dc.getFullYear() + 2000, dc.getMonth(), dc.getDate());
                    }
                    const moisNom = MOIS_FR[dc.getMonth()];
                    const annee = String(dc.getFullYear()).slice(-2);
                    const dateStr = `${String(dc.getDate()).padStart(2,"0")}.${String(dc.getMonth()+1).padStart(2,"0")}.${dc.getFullYear()}`;
                    const fakeData = {
                      fournisseur: enseigne,
                      date_facture: dateStr,
                      numero_facture: `tickets-${moisNom}${annee}`,
                      description: `Achats ${enseigne} — ${moisNom} 20${annee} (${info.count} ticket${info.count > 1 ? "s" : ""})`,
                      lignes_tva: Object.values(lignesGroupees),
                      montant_ttc: info.total,
                      devise: "CHF",
                      reference_qr: null,
                      iban: null,
                      compte_suggere_code: ticketsEnseigne[0]?.compte_suggere_code || "4200",
                      numero_interne: (numeroOverrides[enseigne] || "").trim() || genererNumeroFacture(),
                    };
                    const accForTicket = accounts.find(a => a.code === fakeData.compte_suggere_code) || null;
                    const filesForTicket = (await Promise.all(
                      ticketsEnseigne.map(t => t.ficId ? idbGetFichier(t.ficId) : t.fichier)
                    )).filter(Boolean);
                    await createInBexio(fakeData, accForTicket, "MANUAL", filesForTicket);
                    // Retire CETTE enseigne de la file dès sa création réussie — si une enseigne suivante
                    // échoue, celles déjà créées ne restent pas à tort en attente (risque de doublon sinon).
                    await Promise.all(ticketsEnseigne.map(t => t.ficId ? idbDeleteFichier(t.ficId) : Promise.resolve()));
                    const restants = JSON.parse(localStorage.getItem(cleTickets) || "[]").filter(t => t.fournisseur !== enseigne);
                    localStorage.setItem(cleTickets, JSON.stringify(restants));
                  }
                  setStep(4);
                } catch(e) {
                  setError("Erreur consolidation : " + e.message);
                } finally {
                  setLoading(false);
                  setLoadingMsg("");
                }
              }

              return (
                <div style={{ ...S.section, textAlign: "center" }}>
                  <div style={{ width: 56, height: 56, borderRadius: 14, background: "#2A2008", border: "1px solid #5A430E", color: "#F5A524", display: "flex", alignItems: "center", justifyContent: "center", margin: "0 auto 14px" }}><IcoReceipt s={28} /></div>
                  <h2 style={S.title}>Ticket mis en attente</h2>
                  <p style={S.subtitle}>Ce ticket rejoint la file d'attente du même fournisseur — tu peux consolider à tout moment, pas seulement en fin de mois.</p>
                  <div style={{ ...S.card2, padding: 16, margin: "18px 0", textAlign: "left" }}>
                    <div style={{ ...MINI_LABEL, marginBottom: 12 }}>Tickets en attente</div>
                    {Object.entries(parEnseigne).map(([enseigne, info]) => (
                      <div key={enseigne} style={{ padding: "12px 0", borderBottom: "1px solid #2F4468" }}>
                        <div style={{ display: "flex", justifyContent: "space-between" }}>
                          <span style={{ color: "#ffffff", fontSize: 15, fontWeight: 600 }}>{enseigne} <span style={{ color: "#D3DDEC", fontSize: 13, fontWeight: 400 }}>({info.count} ticket{info.count > 1 ? "s" : ""})</span></span>
                          <span style={{ color: "#F5A524", fontWeight: 700, fontSize: 15 }}>{fCHF(info.total)}</span>
                        </div>
                        {info.possiblesDoublons > 0 && (
                          <div style={{ display: "flex", gap: 10, alignItems: "flex-start", padding: "12px 14px", background: "#3A1414", border: "1px solid #7F1D1D", borderRadius: 12, color: "#FCA5A5", fontSize: 13, lineHeight: 1.45, marginTop: 10 }}>
                            <IcoAlert s={18} inline={false} />
                            <span>{info.possiblesDoublons} ticket{info.possiblesDoublons > 1 ? "s" : ""} ressemble{info.possiblesDoublons > 1 ? "nt" : ""} à un scan déjà fait — vérifie avant de consolider</span>
                          </div>
                        )}
                        <input
                          type="text"
                          value={numeroOverrides[enseigne] ?? peekNumeroFacture()}
                          onChange={e => setNumeroOverrides(o => ({ ...o, [enseigne]: e.target.value }))}
                          style={{ ...S.input, marginBottom: 0, marginTop: 10, color: "#F5A524", fontWeight: 600, fontFamily: MONO, fontSize: 15 }}
                        />
                        {Object.entries(info.lignes).map(([lk, l]) => {
                          const ovKey = `${enseigne}|${lk}`;
                          const compteActuel = comptesTicketsOverrides[ovKey] || l.compte_code;
                          const compteInfo = accounts.find(a => a.code === compteActuel);
                          return (
                            <div key={lk} style={{ display: "flex", flexDirection: "column", gap: 10, marginTop: 10, background: "#121C33", border: "1px solid #2F4468", borderRadius: 14, padding: 14 }}>
                              <div style={{ flex: 1, minWidth: 0 }}>
                                <div style={{ fontSize: 12, color: "#D3DDEC", lineHeight: 1.4 }}>{l.description || "—"} · {l.taux_tva}% · <b style={{ color: "#fff", fontWeight: 600 }}>{fCHF(l.montant_ht)}</b></div>
                              </div>
                              <select
                                value={compteActuel}
                                onChange={e => {
                                  const nouveauCompte = e.target.value;
                                  const nouveauInfo = accounts.find(a => a.code === nouveauCompte);
                                  apprendreCorrection(enseigne, l.description, compteActuel, nouveauCompte, nouveauInfo?.label);
                                  setComptesTicketsOverrides(o => ({ ...o, [ovKey]: nouveauCompte }));
                                }}
                                style={{ ...S.select, background: "#1A2744", backgroundImage: CHEVRON, backgroundRepeat: "no-repeat", backgroundPosition: "right 14px center", fontSize: 14, minHeight: 46, padding: "0 40px 0 14px", borderRadius: 10 }}
                              >
                                {accounts.map(a => <option key={a.code} value={a.code}>{a.code} – {a.label}</option>)}
                              </select>
                            </div>
                          );
                        })}
                      </div>
                    ))}
                  </div>
                  {error && <p style={S.error}>{error}</p>}
                  <div style={{ marginBottom: 16, textAlign: "left" }}>
                    <label style={S.label}>Date de consolidation</label>
                    <input type="date" value={dateConsolidation} onChange={e => {
                      const v = e.target.value;
                      const [y, m, d] = v.split("-");
                      // Le input date natif accepte de taper une année sur 2 chiffres et la stocke telle quelle (ex: 0026 au lieu de 2026)
                      const yCorrige = y && y.length === 4 && Number(y) < 100 ? String(Number(y) + 2000) : y;
                      setDateConsolidation(yCorrige && m && d ? `${yCorrige}-${m}-${d}` : v);
                    }} style={{ ...S.input, marginBottom: 0 }} />
                  </div>
                  <button onClick={consoliderMois} disabled={loading || tickets.length === 0} style={{ ...S.btn, marginBottom: 8, opacity: tickets.length > 0 && !loading ? 1 : 0.35 }}>
                    {loading ? loadingMsg : `Consolider maintenant (${tickets.length} ticket${tickets.length > 1 ? "s" : ""})`}
                  </button>
                  <button onClick={reset} style={{ ...S.btnGhost, width: "100%" }}>Scanner un autre ticket</button>
                  {tickets.length > 0 && (
                    <div style={{ display: "flex", gap: 10, marginTop: 10 }}>
                      <button onClick={dedupliquerTickets} style={{ ...S.btnGhost, flex: 1, fontSize: 13 }}>Nettoyer les doublons</button>
                      <button onClick={viderFileAttente} style={{ ...S.btnGhost, flex: 1, fontSize: 13, color: "#FCA5A5", borderColor: "#7f1d1d" }}>Vider la file</button>
                    </div>
                  )}
                </div>
              );
            })()}

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
